name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: segdup-caller
          channels: conda-forge,bioconda
      - name: Install external tools and test deps
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge -c bioconda gatk4 minimap2 samtools bcftools cnvkit
          pip install pytest
      - name: Run tests
        shell: bash -el {0}
        run: pytest tests -q
