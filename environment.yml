name: segdup-caller
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9
  - pip
  - cnvkit>=0.9.12  # default copy-number backend (--cnv_caller cnvkit)
  - pip:
      - .
# External tools (gatk >=4.2, minimap2 >=2.24, samtools >=1.16, bcftools >=1.16)
# are expected on PATH and are not installed here.
# cnvkit is installed above because it is the default copy-number backend.
